<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Игра «Жизнь»</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    padding: 8px;
    box-sizing: border-box;
    font-family: system-ui, sans-serif;
    text-align: center;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }
  #info {
    font-size: 15px;
    font-weight: 600;
    padding: 4px 0 8px;
  }
  canvas {
    display: block;
    margin: 0 auto;
    border-radius: 8px;
    touch-action: none;
  }
  #controls {
    margin: 8px auto 0;
    max-width: 480px;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  button {
    padding: 10px 4px;
    font-size: 14px;
    border: none;
    border-radius: 10px;
    touch-action: manipulation;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
  }
  button.secondary {
    background: var(--tg-theme-secondary-bg-color, #e8e8e8);
    color: var(--tg-theme-text-color, #000000);
  }
  #btnSend {
    width: 100%;
    margin-top: 6px;
  }
  #status {
    margin-top: 6px;
    font-size: 12px;
    opacity: 0.7;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div id="info">🧬 Жизнь | Поколение: 0 | Живых: 0</div>
  <canvas id="field" width="480" height="480"></canvas>

  <div id="controls">
    <div class="row">
      <button id="btnPlay" type="button">▶ Старт</button>
      <button id="btnStep" type="button" class="secondary">Шаг</button>
      <button id="btnRandom" type="button" class="secondary">Случайно</button>
      <button id="btnClear" type="button" class="secondary">Очистить</button>
    </div>
    <button id="btnSend" type="button">📤 Отправить в чат</button>
  </div>
  <div id="status"></div>

<script>
(function () {
  const statusEl = document.getElementById("status");
  const HINT = "Нажимай на клетки, чтобы задать начальные точки";
  statusEl.textContent = HINT;

  // Показываем JS-ошибки прямо на экране (удобно для отладки на iPhone)
  window.addEventListener("error", function (e) {
    statusEl.textContent = "Ошибка: " + e.message;
  });

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  try {
    tg.disableVerticalSwipes();   // чтобы свайп по полю не сворачивал мини-апп
  } catch (err) {}

  const N = 9;               // размер поля N x N
  const CELL = 480 / N;       // размер клетки в пикселях canvas
  const STEP_MS = 250;        // пауза между поколениями
  const canvas = document.getElementById("field");
  const ctx = canvas.getContext("2d");
  const info = document.getElementById("info");
  const controls = document.getElementById("controls");

  let grid = emptyGrid();
  let generation = 0;
  let running = false;
  let lastTick = 0;

  function emptyGrid() {
    return Array.from({ length: N }, function () {
      return Array(N).fill(0);
    });
  }

  // Стартовая фигура: планер
  function setGlider() {
    grid = emptyGrid();
    const cells = [[0, 1], [1, 2], [2, 0], [2, 1], [2, 2]];
    cells.forEach(function (p) {
      grid[p[0] + 1][p[1] + 1] = 1;
    });
    generation = 0;
  }

  function countAlive() {
    let total = 0;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        total += grid[r][c];
      }
    }
    return total;
  }

  // Подгоняем размер поля под экран, чтобы все влезало без прокрутки
  function fit() {
    const used = info.offsetHeight + controls.offsetHeight + statusEl.offsetHeight + 40;
    const byHeight = window.innerHeight - used;
    const byWidth = window.innerWidth - 16;
    const size = Math.max(160, Math.min(byWidth, byHeight, 480));
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
  }

  // Поле замкнутое: края соединены (тор)
  function step() {
    const next = emptyGrid();
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        let n = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            n += grid[(r + dr + N) % N][(c + dc + N) % N];
          }
        }
        if (grid[r][c]) {
          next[r][c] = (n === 2 || n === 3) ? 1 : 0;
        } else {
          next[r][c] = (n === 3) ? 1 : 0;
        }
      }
    }
    grid = next;
    generation++;
    draw();
  }

  function readVar(name, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }

  function draw() {
    const bg = readVar("--tg-theme-secondary-bg-color", "#eeeeee");
    const accent = readVar("--tg-theme-button-color", "#2481cc");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 480, 480);

    ctx.fillStyle = accent;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (grid[r][c]) {
          ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
        }
      }
    }

    ctx.strokeStyle = "rgba(128,128,128,0.35)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= N; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, 480);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(480, i * CELL);
      ctx.stroke();
    }

    info.textContent = "🧬 Жизнь | Поколение: " + generation + " | Живых: " + countAlive();
  }

  // Рисование пальцем: нажал - задал режим, ведешь - красишь
  let painting = false;
  let paintValue = 1;

  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const c = Math.floor(((e.clientX - rect.left) / rect.width) * N);
    const r = Math.floor(((e.clientY - rect.top) / rect.height) * N);
    if (r >= 0 && r < N && c >= 0 && c < N) {
      return [r, c];
    }
    return null;
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    const pos = cellFromEvent(e);
    if (!pos) return;
    painting = true;
    paintValue = grid[pos[0]][pos[1]] ? 0 : 1;
    grid[pos[0]][pos[1]] = paintValue;
    draw();
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!painting) return;
    e.preventDefault();
    const pos = cellFromEvent(e);
    if (pos && grid[pos[0]][pos[1]] !== paintValue) {
      grid[pos[0]][pos[1]] = paintValue;
      draw();
    }
  });

  window.addEventListener("pointerup", function () {
    painting = false;
  });
  window.addEventListener("pointercancel", function () {
    painting = false;
  });

  // Анимация через requestAnimationFrame (надежнее на iPhone)
  const btnPlay = document.getElementById("btnPlay");

  function loop(ts) {
    if (!running) return;
    if (ts - lastTick >= STEP_MS) {
      lastTick = ts;
      step();
    }
    requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
    btnPlay.textContent = "▶ Старт";
  }

  btnPlay.addEventListener("click", function () {
    if (running) {
      stop();
      return;
    }
    running = true;
    lastTick = 0;
    btnPlay.textContent = "⏸ Пауза";
    requestAnimationFrame(loop);
  });

  document.getElementById("btnStep").addEventListener("click", function () {
    stop();
    step();
  });

  document.getElementById("btnRandom").addEventListener("click", function () {
    stop();
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        grid[r][c] = Math.random() < 0.28 ? 1 : 0;
      }
    }
    generation = 0;
    draw();
  });

  document.getElementById("btnClear").addEventListener("click", function () {
    stop();
    grid = emptyGrid();
    generation = 0;
    draw();
    statusEl.textContent = HINT;
  });

  document.getElementById("btnSend").addEventListener("click", function () {
    stop();
    const rows = grid.map(function (row) {
      return row.join("");
    });
    const payload = JSON.stringify({ gen: generation, g: rows });
    statusEl.textContent = "Отправляю...";
    try {
      // Для кнопок клавиатуры initData пустая - это нормально, поэтому ее не проверяем
      tg.sendData(payload);   // отправит данные боту и закроет мини-апп
    } catch (err) {
      statusEl.textContent = "Не удалось отправить: " + err.message;
    }
  });

  window.addEventListener("resize", fit);
  try {
    tg.onEvent("viewportChanged", fit);
  } catch (err) {}

  setGlider();
  fit();
  draw();
  setTimeout(fit, 300);   // повторная подгонка, когда Telegram закончит раскрывать окно
})();
</script>
</body>
</html>
